# 新発売ポチの更新ワークフロー。
# Cloud Scheduler（ジョブ名 shinhatsubai-pochi-update、毎日10:00 JST）が workflow_dispatch で起動する。
# 6つの食ポチの更新（7:00〜9:30）が終わった後に、データ集約→静的書き出し→docs/ の更新までを行う。
# schedule: を使わないのは意図的。GitHub の cron は負荷が高いと実行がスキップされるため。
name: update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout source repos
        uses: actions/checkout@v4
        with:
          repository: netafull/conbini-pochi
          path: sources/conbini-pochi
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: netafull/fastfood-pochi
          path: sources/fastfood-pochi
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: netafull/cupmen-pochi
          path: sources/cupmen-pochi
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: netafull/cafe-pochi
          path: sources/cafe-pochi
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: netafull/sushi-pochi
          path: sources/sushi-pochi
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: netafull/famires-pochi
          path: sources/famires-pochi
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Aggregate
        run: python scripts/aggregate.py --repos sources

      - name: Build static site
        run: python scripts/build_static.py
        env:
          GA4_ID: ${{ vars.GA4_ID }}

      - name: Test
        run: python -m unittest test_app

      - name: Commit and push
        run: |
          if [ -n "$(git status --porcelain docs data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs data
            git commit -m "Update data ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
            git push
          else
            echo "変更なし"
          fi
